# faithBOT · cloud helper: every 30 minutes GitHub runs faithbot_cloud.py for you (no Mac needed).
name: faithBOT helper
on:
  schedule:
    - cron: '7 * * * *'      # hourly (faithBOT also starts it when GitHub skips a run)
  workflow_dispatch:          # the "Run workflow" button, to try it at once
permissions:
  contents: read
  actions: write   # v52: to start the notes run (below) when GitHub skipped its hourly schedule
concurrency:
  group: faithbot-helper
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make sure the notes run is going (GitHub sometimes skips its hourly schedule)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          busy=$(gh run list -R "$GITHUB_REPOSITORY" -w turbo.yml -L 5 --json status -q '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting")] | length')
          if [ "${busy:-0}" = "0" ]; then gh workflow run turbo.yml -R "$GITHUB_REPOSITORY" --ref main && echo "started the notes run"; else echo "the notes run is already going"; fi
      - run: pip install -q telethon requests
      - run: python faithbot_cloud.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FAITHBOT_URL: ${{ secrets.FAITHBOT_URL }}
          FAITHBOT_KEY: ${{ secrets.FAITHBOT_KEY }}
