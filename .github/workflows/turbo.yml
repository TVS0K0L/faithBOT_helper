# faithBOT · the backlog on GitHub: full notes of every old Кафедра, Горница and morning word.
# Each run works up to ~5.5 hours; a new one starts every 6 hours (and faithBOT starts one if GitHub skips it).
name: faithBOT backlog
on:
  schedule:
    - cron: '20 */6 * * *'
  workflow_dispatch:
concurrency:
  group: faithbot-turbo
  cancel-in-progress: false
jobs:
  turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q telethon requests yt-dlp
      - run: python turbo.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FAITHBOT_URL: ${{ secrets.FAITHBOT_URL }}
          FAITHBOT_KEY: ${{ secrets.FAITHBOT_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
