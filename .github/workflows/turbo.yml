# faithBOT · the backlog on GitHub: full notes of every old Кафедра, Горница and morning word (until 21 Nov 2026);
# v41: then, quietly, the missing transcripts and the night study for the Pastor (Dubai 22:00–07:00).
# v51: every hour, the new Кафедра, Горница and morning words first (sent to everyone), then the archive.
name: faithBOT backlog
on:
  schedule:
    - cron: '20 * * * *'  # v51: hourly; the new recordings come first in every run (a run still in progress just carries on)
  workflow_dispatch:
concurrency:
  group: faithbot-turbo
  cancel-in-progress: false
jobs:
  turbo:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null && pip install -q telethon requests yt-dlp
      - uses: actions/cache/restore@v4  # transcripts kept from an earlier run (their notes still to write)
        with:
          path: pending
          key: turbo-pending-${{ github.run_id }}
          restore-keys: turbo-pending-
      - run: python turbo.py
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          FAITHBOT_URL: ${{ secrets.FAITHBOT_URL }}
          FAITHBOT_KEY: ${{ secrets.FAITHBOT_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_KEY2: ${{ secrets.GEMINI_KEY2 }}
          GEMINI_KEY3: ${{ secrets.GEMINI_KEY3 }}
          GEMINI_KEY4: ${{ secrets.GEMINI_KEY4 }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pending
          key: turbo-pending-${{ github.run_id }}
